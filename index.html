<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#182b2a"><title>Monsterreise – Integrationstest v0.3</title><link rel="stylesheet" href="styles.css"></head><body><main id="app"><header><strong>MONSTERREISE</strong><div class="header-actions"><label for="save-slot">Platz</label><select id="save-slot" aria-label="Speicherplatz"><option value="1">1</option><option value="2">2</option><option value="3">3</option></select><button id="save-button" type="button">Speichern</button><button id="battle-test-toggle" type="button" title="Fallback: manueller Testkampf aus Auftrag 016">Testkampf (Fallback)</button><button id="team-toggle" type="button">Team</button><span id="map-label">Startdorf (Test)</span><button id="fullscreen-toggle" type="button" aria-label="Vollbilddarstellung einschalten" aria-pressed="false" title="Vollbilddarstellung einschalten"><span data-fullscreen-icon aria-hidden="true">⛶</span></button></div></header><div id="stage"><canvas id="game" aria-label="Testkarte mit beweglicher Spielfigur"></canvas><div id="dialog" role="status" aria-live="polite" hidden><strong id="dialog-speaker"></strong><p id="dialog-line"></p><small>Weiter: Enter / Leertaste / Aktion</small></div><section id="pokemon-panel" role="dialog" aria-modal="true" aria-labelledby="pokemon-panel-title" hidden><div class="pokemon-panel-inner"><div class="pokemon-panel-head"><h2 id="pokemon-panel-title">Pokémon-Team</h2><button id="pokemon-panel-close" type="button" aria-label="Menü schließen">Schließen</button></div><div id="pokemon-panel-content"></div></div></section><section id="battle-panel" role="dialog" aria-modal="true" aria-labelledby="battle-title" hidden><div class="battle-shell"><div class="battle-head"><h2 id="battle-title">Testkampf – vorläufige Attackendaten</h2><button id="battle-close" type="button">Schließen</button></div><div id="battle-content"></
